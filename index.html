<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Barcode Scanner</title>

  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }

    video {
      width: 320px;
      margin-top: 20px;
      display: none;
    }

    button {
      font-size: 18px;
      padding: 12px 20px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>📦 Barcode Scanner</h2>

<button id="startBtn">Start Scanning</button>

<video id="video" autoplay></video>

<div id="status">Idle</div>

<script>

const ENDPOINT = "https://script.google.com/macros/s/AKfycbyMqsbNyd5V5gn5IwiyEBgD2goDgEHK-lIXbL6zYsNnX_zRBIC6xnp5RSJN9Y97HC4_7w/exec";

let codeReader;

document.getElementById("startBtn").addEventListener("click", async () => {

  document.getElementById("status").innerText = "Starting camera...";

  const video = document.getElementById("video");
  video.style.display = "block";

  codeReader = new ZXing.BrowserMultiFormatReader();

  try {

    const devices = await codeReader.listVideoInputDevices();

    if (devices.length === 0) {
      document.getElementById("status").innerText = "No camera found";
      return;
    }

    const selectedDeviceId = devices[devices.length - 1].deviceId;

    document.getElementById("status").innerText =
      "Camera active. Point at barcode.";

    codeReader.decodeFromVideoDevice(
      selectedDeviceId,
      video,
      async (result, err) => {

        if (result) {

          const text = result.getText();

          document.getElementById("status").innerText =
            "Scanned: " + text;

          try {
            await fetch(ENDPOINT, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                barcode: text
              })
            });

            document.getElementById("status").innerText =
              "Saved: " + text;

          } catch (e) {
            document.getElementById("status").innerText =
              "Save error: " + e.message;
          }
        }
      }
    );

  } catch (err) {
    document.getElementById("status").innerText =
      "ERROR: " + err.message;
  }

});

</script>

</body>
</html>
