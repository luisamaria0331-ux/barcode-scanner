<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Barcode Scanner</title>

  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 20px;
    }

    video {
      width: 90%;
      max-width: 420px;
      height: auto;
      margin-top: 20px;
      border-radius: 10px;
    }

    button {
      font-size: 18px;
      padding: 12px 20px;
      margin-top: 10px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>📦 Barcode Scanner</h2>

<button id="startBtn">Start Scanning</button>

<video id="video" autoplay muted playsinline></video>

<div id="status">Idle</div>

<script>

const ENDPOINT = "https://script.google.com/macros/s/AKfycbyMqsbNyd5V5gn5IwiyEBgD2goDgEHK-lIXbL6zYsNnX_zRBIC6xnp5RSJN9Y97HC4_7w/exec";

let codeReader;

document.getElementById("startBtn").addEventListener("click", async () => {

  document.getElementById("status").innerText = "Starting camera...";

  const video = document.getElementById("video");

  try {

    codeReader = new ZXing.BrowserMultiFormatReader();

    const devices = await codeReader.listVideoInputDevices();

    if (!devices || devices.length === 0) {
      document.getElementById("status").innerText = "No camera found";
      return;
    }

    const deviceId = devices[devices.length - 1].deviceId;

    // 🔥 IMPORTANT: improve “zoomed in” feeling
    const constraints = {
      video: {
        deviceId: { exact: deviceId },
        width: { ideal: 1280 },
        height: { ideal: 720 },
        facingMode: "environment"
      }
    };

    document.getElementById("status").innerText =
      "Camera active. Point at barcode.";

    video.style.display = "block";

    codeReader.decodeFromVideoDevice(
      deviceId,
      video,
      async (result, err) => {

        if (result) {

          const text = result.getText();

          document.getElementById("status").innerText =
            "Scanned: " + text;

          try {

            // 🔥 FIX: use GET instead of POST (this solves "load failed")
            await fetch(ENDPOINT + "?barcode=" + encodeURIComponent(text));

            document.getElementById("status").innerText =
              "Saved: " + text;

          } catch (e) {

            document.getElementById("status").innerText =
              "Save failed: " + e.message;
          }
        }
      }
    );

  } catch (err) {

    document.getElementById("status").innerText =
      "ERROR: " + err.message;
  }

});

</script>

</body>
</html>
