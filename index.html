<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { font-family: Arial; text-align: center; padding: 20px; }
    #reader { width: 320px; margin: auto; display: none; }
    button { font-size: 18px; padding: 12px 20px; }
    #status { margin-top: 10px; }
  </style>
</head>

<body>

<h2>📦 Barcode Scanner</h2>

<button id="startBtn">Start Scanning</button>

<div id="reader"></div>
<div id="status">Idle</div>

<script>

const ENDPOINT = https://script.google.com/macros/s/AKfycbyMqsbNyd5V5gn5IwiyEBgD2goDgEHK-lIXbL6zYsNnX_zRBIC6xnp5RSJN9Y97HC4_7w/exec;

let scanner;

document.getElementById("startBtn").addEventListener("click", async () => {

  document.getElementById("startBtn").style.display = "none";
  document.getElementById("reader").style.display = "block";

  scanner = new Html5Qrcode("reader");

  const cameras = await Html5Qrcode.getCameras();
  const cameraId = cameras[0].id;

  document.getElementById("status").innerText = "Camera active...";

  scanner.start(
    cameraId,
    { fps: 10, qrbox: 250 },
    async (decodedText) => {

      document.getElementById("status").innerText =
        "Scanned: " + decodedText;

      await fetch(ENDPOINT, {
        method: "POST",
        body: JSON.stringify({ barcode: decodedText }),
        headers: { "Content-Type": "application/json" }
      });

    }
  );

});

</script>

</body>
</html>
