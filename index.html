<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Barcode Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #reader {
      width: 320px;
      margin: 20px auto;
      display: none;
    }

    button {
      font-size: 18px;
      padding: 12px 20px;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>📦 Barcode Scanner</h2>

<button id="startBtn">Start Scanning</button>

<div id="reader"></div>

<div id="status">Idle</div>

<script>

const ENDPOINT = "https://script.google.com/macros/s/AKfycbyMqsbNyd5V5gn5IwiyEBgD2goDgEHK-lIXbL6zYsNnX_zRBIC6xnp5RSJN9Y97HC4_7w/exec";

let scanner;

document.getElementById("startBtn").addEventListener("click", async () => {

  document.getElementById("status").innerText = "Starting camera...";

  try {

    const cameras = await Html5Qrcode.getCameras();

    if (!cameras || cameras.length === 0) {
      document.getElementById("status").innerText = "No cameras found";
      return;
    }

    const cameraId = cameras[cameras.length - 1].id;

    document.getElementById("reader").style.display = "block";

    scanner = new Html5Qrcode("reader");

    await scanner.start(
      cameraId,
      {
        fps: 15,

        qrbox: { width: 280, height: 120 },

        // 🔥 KEY FIX: barcode formats only (NO QR CODES)
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.CODE_39
        ],

        // helps a bit with mobile cameras
        experimentalFeatures: {
          useBarCodeDetectorIfSupported: true
        }
      },

      async (decodedText) => {

        document.getElementById("status").innerText =
          "Scanned: " + decodedText;

        try {
          await fetch(ENDPOINT, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              barcode: decodedText
            })
          });

          document.getElementById("status").innerText =
            "Saved: " + decodedText;

        } catch (err) {
          document.getElementById("status").innerText =
            "Save error: " + err.message;
        }
      },

      () => {}
    );

    document.getElementById("status").innerText =
      "Camera active. Point at barcode.";

  } catch (err) {
    document.getElementById("status").innerText =
      "ERROR: " + err.message;
  }

});

</script>

</body>
</html>
