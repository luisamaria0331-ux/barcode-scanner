<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Barcode Scanner</title>

  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      padding: 15px;
      background: #111;
      color: white;
    }

    #container {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: auto;
    }

    video {
      width: 100%;
      border-radius: 12px;
      background: black;
    }

    /* 🎯 scanning guide box optimized for thin barcodes */
    #overlay {
      position: absolute;
      top: 40%;
      left: 10%;
      width: 80%;
      height: 12%;
      border: 2px solid #00ff88;
      border-radius: 8px;
      box-shadow: 0 0 10px #00ff88;
      pointer-events: none;
    }

    button {
      font-size: 18px;
      padding: 12px 20px;
      margin-top: 10px;
    }

    #status {
      margin-top: 12px;
      font-weight: bold;
      color: #00ff88;
    }
  </style>
</head>

<body>

<h2>📦 Barcode Scanner</h2>

<button id="startBtn">Start Scanning</button>

<div id="container">
  <video id="video" autoplay muted playsinline></video>
  <div id="overlay"></div>
</div>

<div id="status">Idle</div>

<script>

const ENDPOINT = "https://script.google.com/macros/s/AKfycbyMqsbNyd5V5gn5IwiyEBgD2goDgEHK-lIXbL6zYsNnX_zRBIC6xnp5RSJN9Y97HC4_7w/exec";

let reader;

document.getElementById("startBtn").addEventListener("click", async () => {

  document.getElementById("status").innerText = "Starting camera...";

  try {

    reader = new ZXing.BrowserMultiFormatReader();

    const devices = await reader.listVideoInputDevices();

    if (!devices.length) {
      document.getElementById("status").innerText = "No camera found";
      return;
    }

    const deviceId = devices[devices.length - 1].deviceId;

    document.getElementById("status").innerText =
      "Align barcode in green box";

    reader.decodeFromVideoDevice(
      deviceId,
      document.getElementById("video"),
      async (result, err) => {

        if (result) {

          const text = result.getText();

          document.getElementById("status").innerText =
            "Scanned: " + text;

          // stable Google Sheets call
          const url = ENDPOINT + "?barcode=" + encodeURIComponent(text);

          try {
            await fetch(url);
            document.getElementById("status").innerText =
              "Saved ✔ " + text;
          } catch (e) {
            document.getElementById("status").innerText =
              "Save failed: " + e.message;
          }
        }
      }
    );

  } catch (err) {
    document.getElementById("status").innerText =
      "ERROR: " + err.message;
  }

});

</script>

</body>
</html>
